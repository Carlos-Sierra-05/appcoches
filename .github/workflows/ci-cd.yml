name: CI/CD Pipeline - AppCoches

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # JOB 1: TESTS Y VALIDACIÓN
  # ============================================
  test:
    name: Tests y Validación
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: AppCoches9393
          MYSQL_DATABASE: appcoches
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: 🗄️ Configurar base de datos
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASSWORD: AppCoches9393
        DB_NAME: appcoches
      run: |
        mysql -h 127.0.0.1 -u root -pAppCoches9393 appcoches < docker/init.sql
    
    - name: ✅ Verificar sintaxis Python
      run: |
        cd backend
        python -m py_compile *.py
    
    - name: 🔍 Validar imports
      run: |
        cd backend
        python -c "import app; import config; import database; import registro; import login; import coches"

  # ============================================
  # JOB 2: ESCANEO DE SEGURIDAD
  # ============================================
  security:
    name: Escaneo de Seguridad
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: 📦 Instalar herramientas de seguridad
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: 🔒 Escanear vulnerabilidades en dependencias
      run: |
        cd backend
        pip install -r requirements.txt
        safety check || true
    
    - name: 🔒 Análisis de seguridad del código
      run: |
        cd backend
        bandit -r . -ll || true

  # ============================================
  # JOB 3: BUILD DOCKER
  # ============================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🏗️ Build imagen de la aplicación
      run: |
        cd docker
        docker-compose build
    
    - name: ✅ Verificar imágenes creadas
      run: |
        docker images

  # ============================================
  # JOB 4: VALIDACIÓN FRONTEND
  # ============================================
  frontend:
    name: Validación Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: ✅ Verificar archivos HTML
      run: |
        cd frontend
        ls -la *.html
        echo "✅ Archivos frontend verificados"
    
    - name: 🔍 Validar estructura HTML
      run: |
        cd frontend
        for file in *.html; do
          echo "Validando $file..."
          grep -q "<!DOCTYPE html>" "$file" && echo "✓ $file tiene DOCTYPE" || echo "✗ $file sin DOCTYPE"
        done

  # ============================================
  # JOB 5: REPORTE FINAL
  # ============================================
  report:
    name: Reporte CI/CD
    runs-on: ubuntu-latest
    needs: [test, security, build, frontend]
    if: always()
    
    steps:
    - name: 📊 Generar reporte
      run: |
        echo "======================================"
        echo "   REPORTE CI/CD - APPCOCHES"
        echo "======================================"
        echo ""
        echo "✅ Pipeline completado"
        echo "📅 Fecha: $(date)"
        echo "🔖 Commit: ${{ github.sha }}"
        echo "👤 Autor: ${{ github.actor }}"
        echo "🌿 Branch: ${{ github.ref_name }}"
        echo ""
        echo "Estado de los jobs:"
        echo "  - Tests: ${{ needs.test.result }}"
        echo "  - Security: ${{ needs.security.result }}"
        echo "  - Build: ${{ needs.build.result }}"
        echo "  - Frontend: ${{ needs.frontend.result }}"
        echo "======================================"
