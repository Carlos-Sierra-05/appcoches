# pytest.ini
# Configuración de pytest para AppCoches

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    slow: tests lentos
    auth: tests de autenticación
    security: tests de seguridad
    integration: tests de integración

filterwarnings =
    ignore::DeprecationWarning